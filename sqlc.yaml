version: "2"
sql:
- schema: "./db/migration/"
  queries: "./db/query/"
  engine: "postgresql"
  gen:
    go: 
      package: "db"
      out: "./db/sqlc"
      sql_package: "pgx/v5"
      emit_json_tags: true
      emit_empty_slices: true
      emit_interface: true
      overrides:
        - column: "users.password_changed_at"
          go_type: "time.Time"
        - column: "users.created_at"
          go_type: "time.Time"
        - column: "accounts.created_at"
          go_type: "time.Time"
        - column: "entries.created_at"
          go_type: "time.Time"
        - column: "transfers.created_at"
          go_type: "time.Time"